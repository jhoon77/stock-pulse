<style>
/* Layout: one 16:9 screening stage under dim hof-house light, a control rail beneath it, then the scene list. Single dark look by choice. */
:root{
  --ink:#10121d;
  --panel:#1a1d2c;
  --line:#2b2f45;
  --text:#f3ecdf;
  --muted:#a7a2b6;
  --beer:#f2a93b;
  --down:#4f86ff;
  --up:#ff5a4f;
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Gaegu","Noto Sans KR","Apple SD Gothic Neo",cursive;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
.head{display:grid;gap:6px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--beer)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.05;text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--muted);text-wrap:pretty}
.lede .d{color:var(--down)} .lede .b{color:var(--beer)}
.screen{margin:0;border-radius:14px;overflow:hidden;background:#05060c;border:1px solid var(--line)}
.stage-wrap{position:relative;cursor:pointer}
#stage{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;background:#0b0d18}
.f-display{font-family:var(--display)} .f-body{font-family:var(--body)} .f-hand{font-family:var(--hand);font-weight:700} .f-mono{font-family:var(--mono)}
.bigplay{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:var(--beer);color:#1b1206;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.bigplay svg{width:34px;height:34px;margin-left:5px}
.controls{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:#23273a;color:var(--text);height:36px;min-width:36px;padding:0 12px;border-radius:8px;font:500 14px/1 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2c3149}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--beer);color:#1b1206;border-color:transparent;min-width:104px}
.btn.primary:hover{background:#f6b956}
.btn[aria-pressed="true"]{border-color:var(--beer);color:var(--beer)}
.btn:focus-visible,.chip:focus-visible,#scrub:focus-visible,.bigplay:focus-visible{outline:2px solid var(--beer);outline-offset:2px}
#scrub{flex:1;min-width:0;accent-color:var(--beer);height:24px}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:6px 14px 6px 10px;font:500 13px/1.2 var(--body);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chip:hover{background:#1f2335}
.chip .t{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.chip[aria-current="true"] .t{color:#5a5570}
.note{margin:0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 16px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:600px){
  .controls{flex-wrap:wrap}
  #scrub{order:9;flex-basis:100%}
  .btn .lbl{display:none}
  .btn.primary{min-width:44px}
}
</style>

<main class="wrap">
  <header class="head">
    <p class="eyebrow">Motion graphic · 60s loop</p>
    <h1>서학개미 퇴근주</h1>
    <p class="lede">계좌는 <span class="d">파랗고</span> 맥주는 <span class="b">노랗다</span>. 손실 중인 서학개미 두 명이 퇴근 후 을지로 호프집에서 500cc를 부딪히며 서로를 위로하는 밤.</p>
  </header>

function makeBubble(id, who) {
  const g = $('#' + id);
  const shadow = el('rect', { rx: 22, fill: '#000', opacity: .3 }, g);
  const tail = el('path', { fill: '#fffaf0' }, g);
  const box = el('rect', { rx: 22, fill: '#fffaf0' }, g);
  const txt = el('text', { class: 'f-hand', 'font-size': 31, fill: '#1d1622', 'text-anchor': 'middle' }, g);
  return { g, shadow, tail, box, txt, cur: null, who, tip: who === 'a' ? [366, 236] : [914, 236] };
}
const BUB = { a: makeBubble('bubbleA', 'a'), b: makeBubble('bubbleB', 'b') };
function setBubble(b, text) {
  b.cur = text;
  while (b.txt.firstChild) b.txt.firstChild.remove();
  const ls = text.split('\n'), spans = ls.map(l => { const s = el('tspan', {}, b.txt); s.textContent = l; return s; });
  let mw = 0; spans.forEach(s => { mw = Math.max(mw, s.getComputedTextLength()); });
  const w = mw + 52, h = ls.length * 38 + 30;
  const cx = b.who === 'a' ? 230 : 1050;
  const x = clamp(cx - w / 2, 24, 1256 - w), y = 198 - h;
  [b.box, b.shadow].forEach((e, i) => { e.setAttribute('x', f1(x)); e.setAttribute('y', f1(y + i * 0)); e.setAttribute('width', f1(w)); e.setAttribute('height', f1(h)); });
  b.shadow.setAttribute('y', f1(y + 6));
  spans.forEach((s, i) => { s.setAttribute('x', f1(x + w / 2)); s.setAttribute('y', f1(y + 44 + i * 38)); });
  const bx = b.who === 'a' ? x + w * .62 : x + w * .38 - 34;
  b.tail.setAttribute('d', `M${f1(bx)},${f1(y + h - 4)} L${b.tip[0]},${b.tip[1]} L${f1(bx + 34)},${f1(y + h - 4)} Z`);
}

  cap.bg.setAttribute('width', f1(cap.txt.getComputedTextLength() + 36));

function stateFor(p, t) { let s = SCRIPT[p][0]; for (const row of SCRIPT[p]) if (t >= row[0]) s = row; return { mood: s[1], look: s[2] }; }
const activeLine = t => LINES.find(l => t >= l.a && t < l.b);

function mugPose(p, t) {
  const m = MUG[p];
  if (t < m.drop) return [m.rest[0], -220, 0];
  if (t < m.drop + .8) return [m.rest[0], lerp(-160, m.rest[1], eBounce(seg(t, m.drop, m.drop + .8))), 0];
  const B = (P, Q, k) => [lerp(P[0], Q[0], k), lerp(P[1], Q[1], k), lerp(P[2], Q[2], k)];
  let q = m.rest;
  if (t >= 25.3 && t < 26.3) q = B(m.rest, m.clink, eIO(seg(t, 25.3, 26.3)));
  else if (t >= 26.3 && t < 27) q = m.clink;
  else if (t >= 27 && t < 27.8) q = B(m.clink, m.sip, eIO(seg(t, 27, 27.8)));
  else if (t >= 27.8 && t < 28.8) q = m.sip;
  else if (t >= 28.8 && t < 29.6) q = B(m.sip, m.rest, eIO(seg(t, 28.8, 29.6)));
  q = q.slice();
  if (t >= 26.3 && t < 26.8) q[0] += Math.sin(t * 110) * 5 * (1 - seg(t, 26.3, 26.8)) * (p === 'a' ? -1 : 1);
  return q;
}
function beerLevel(t) {
  if (t < 27.8) return .92;
  if (t < 28.8) return lerp(.92, .62, seg(t, 27.8, 28.8));
  if (t < 43.3) return lerp(.62, .36, seg(t, 29.6, 42.4));
  return .9;
}
function gripWorld(p, t) {
  const m = MUG[p], [x, y, a] = mugPose(p, t), rad = a * Math.PI / 180, gx = m.s * 61.5, gy = -59;
  return [x + gx * Math.cos(rad) - gy * Math.sin(rad), y + gx * Math.sin(rad) + gy * Math.cos(rad)];
}
function clockMin(t) {
  const s = 19 * 60 + 40;
  if (t < 42.6) return lerp(s, 21 * 60 + 20, seg(t, 7, 42.6));
  if (t < 44.4) return lerp(21 * 60 + 20, 23 * 60 + 29, eIO(seg(t, 42.6, 44.4)));
  return lerp(23 * 60 + 29, 23 * 60 + 37, seg(t, 44.4, 60));
}

function renderAnt(p, t, k) {
  const A = ANT[p], st = stateFor(p, t), m = MOODS[st.mood];
  const line = activeLine(t), speaking = line && line.who === p;
  const blink = !m.happy && ((t + A.ph) % 3.9) < .13;
  const lid = blink ? 1 : m.lid;
  A.eyes.setAttribute('opacity', m.happy ? 0 : 1);
  A.happy.setAttribute('opacity', m.happy ? 1 : 0);
  const phone = st.look === 'phone';
  EYES.forEach(([ex, ey], i) => {
    A.lid[i].setAttribute('height', f1(lid * 42));
    A.pup[i].setAttribute('cx', f1(ex + (phone ? 3 : 5)));
    A.pup[i].setAttribute('cy', f1(ey + (phone ? 8 : 0)));
    A.pup[i].setAttribute('r', st.mood === 'shock' ? 5.5 : 8);
    const bx = ex, by = ey - 31;
    A.brow[i].setAttribute('transform', `translate(0,${m.b[2]}) rotate(${m.b[i]} ${bx} ${by})`);
  });
  let key = st.mood;
  if (speaking) { const open = Math.sin(t * 21 + A.ph) > 0; key = open ? (m.happy ? 'laugh' : 'talk') : (m.happy ? 'happy' : (key === 'sad' ? 'sad' : 'neutral')); }
  A.mouth.setAttribute('d', MOUTH[key][0]); A.mouth.setAttribute('fill', MOUTH[key][1]);

  A.droop += (m.droop - A.droop) * k;
  const springy = st.mood === 'happy' || st.mood === 'laugh';
  const amp = springy ? 9 : 2.5, fr = springy ? 10 : 2;
  A.an0.setAttribute('transform', `rotate(${f1(-A.droop * 32 + Math.sin(t * fr + A.ph) * amp)} -2 -302)`);
  A.an1.setAttribute('transform', `rotate(${f1(A.droop * 32 + Math.sin(t * fr + A.ph + 1.3) * amp)} 40 -304)`);

  const tiltT = phone ? 9 : st.mood === 'laugh' ? -8 : st.mood === 'sad' ? 4 : 0;
  A.tilt += (tiltT - A.tilt) * k;
  let bob = Math.sin(t * 1.7 + A.ph) * 1.4;
  if (speaking) bob += Math.sin(t * 11) * 2.2;
  if (st.mood === 'laugh') bob -= Math.abs(Math.sin(t * 13)) * 5;
  const lean = 10 * eIO(seg(t, 25.3, 26.3)) * (1 - eIO(seg(t, 26.8, 27.6)));
  A.head.setAttribute('transform', `translate(${f1(lean)},${f1(bob)}) rotate(${f1(A.tilt)} 20 -196)`);

  const red = t >= 49.6 && t < 53.2, lit = (t >= 8 && t < 20.5) || (t >= 44.6 && t < 53.2);
  const gT = lit ? (phone ? .32 : .12) : 0;
  A.glowV += (gT - A.glowV) * k;
  A.glow.setAttribute('opacity', A.glowV.toFixed(3));
  A.glow.setAttribute('fill', red ? UP : DOWN);
  const blush = (seg(t, 27.5, 44) * .75).toFixed(2);
  A.blush.forEach(b => b.setAttribute('opacity', blush));

  const rest = [p === 'a' ? 465 : 815, 520];
  const grip = gripWorld(p, t);
  const kk = eIO(seg(t, 22.9, 23.5)) * (1 - eIO(seg(t, 44.8, 45.4)));
  const hw = [lerp(rest[0], grip[0], kk), lerp(rest[1], grip[1], kk)];
  const hx = (hw[0] - A.ox) * A.sx, hy = hw[1] - 560;
  const sx = 62, sy = -160, mx = (sx + hx) / 2, my = (sy + hy) / 2;
  A.arm.setAttribute('d', `M${sx},${sy} Q${f1(mx - 14)},${f1(my + 26)} ${f1(hx)},${f1(hy)}`);
  A.hand.setAttribute('cx', f1(hx)); A.hand.setAttribute('cy', f1(hy));
}

function renderMug(p, t) {
  const m = MUG[p], [x, y, a] = mugPose(p, t), l = beerLevel(t);
  m.g.setAttribute('transform', `translate(${f1(x)},${f1(y)}) rotate(${f1(a)})`);
  const top = -4 - l * 92;
  m.lv.setAttribute('y', f1(top)); m.lv.setAttribute('height', f1(-4 - top));
  const settle = t >= m.drop + .4 && t < m.drop + 1.6 ? Math.sin((t - m.drop) * 18) * 3 * (1 - seg(t, m.drop + .4, m.drop + 1.6)) : 0;
  m.foam.setAttribute('transform', `translate(0,${f1(top + 4 + settle)})`);
  const span = Math.max(6, l * 92 - 8);
  m.bubs.forEach((b, i) => b.setAttribute('cy', f1(-6 - ((t * 34 * (1 + i * .13) + i * 13) % span))));
}

const city = $('#city'), pub = $('#pub'), pubInner = $('#pubInner');
function render(t, dt) {
  const k = dt >= .25 ? 1 : 1 - Math.exp(-dt * 8);
  const inCity = t < 8.2;
  show(city, inCity); show(pub, !inCity);

  if (inCity) {
    starEls.forEach(s => s.e.setAttribute('opacity', (.35 + .65 * (.5 + .5 * Math.sin(t * s.sp + s.ph))).toFixed(2)));
    towerLit.forEach(w => { const on = t < w.off; if (on !== w.lit) { w.lit = on; w.e.setAttribute('fill', on ? '#ffcf7a' : '#2a2f4a'); } });
    ticker.setAttribute('x', f1(850 - ((t * 120) % (tickW + 420))));
    const pr = seg(t, .2, 6.4), xA = lerp(110, 1085, pr), fadeIn = 1 - seg(t, 5.9, 6.5);
    walkers.forEach((w, i) => {
      const x = xA - i * 66, ph = t * 9 + i * 1.4, sw = Math.sin(ph) * 10, bob = -Math.abs(Math.sin(ph)) * 4;
      w.g.setAttribute('transform', `translate(${f1(x)},${f1(640 + bob * .5)}) scale(.5)`);
      w.g.setAttribute('opacity', fadeIn.toFixed(2));
      w.l1.setAttribute('x2', f1(-6 + sw)); w.l2.setAttribute('x2', f1(6 - sw));
      w.head.setAttribute('transform', `rotate(${f1(10 + Math.sin(t * 2 + i) * 2)} 0 -100)`);
    });
    const sp = seg(t, 2.4, 4.4);
    sigh.setAttribute('x', f1(xA - 33)); sigh.setAttribute('y', f1(560 - sp * 30));
    sigh.setAttribute('opacity', win(t, 2.4, 4.4, .4).toFixed(2));
    $('#titleCard').setAttribute('opacity', (1 - seg(t, 5.6, 6.6)).toFixed(2));
    const z = 1 + eIO(seg(t, 6.6, 8.2)) * 1.6;
    city.setAttribute('transform', `translate(1090,594) scale(${z.toFixed(3)}) translate(-1090,-594)`);
    $('#pubSign').setAttribute('opacity', ((t % 5.3) < .1 || ((t % 5.3) > .2 && (t % 5.3) < .26)) ? .4 : 1);
  } else {
    $('#lamp').setAttribute('transform', `rotate(${f1(Math.sin(t * .8) * 1.6)} 640 0)`);
    const ft = t % 7.3; $('#neonHof').setAttribute('opacity', (ft < .1 || (ft > .22 && ft < .3)) ? .35 : 1);
    const M = clockMin(t);
    $('#hourHand').setAttribute('transform', `rotate(${f1(((M / 60) % 12) * 30)} 770 100)`);
    $('#minHand').setAttribute('transform', `rotate(${f1((M % 60) * 6)} 770 100)`);
    rain.forEach(d => { const y = 240 + ((d.o + t * d.sp) % 210); d.e.setAttribute('transform', `translate(${f1(d.x)},${f1(y)})`); });

    const live = t >= 44.6;
    $('#tvDown').setAttribute('opacity', live ? 0 : 1); $('#tvLive').setAttribute('opacity', live ? 1 : 0);
    $('#liveDot').setAttribute('opacity', (Math.sin(t * 6) > 0) ? 1 : .3);
    const up = t >= 49.6;
    const tvVal = $('#tvVal');
    if (up) { tvVal.textContent = '▲0.42%'; tvVal.setAttribute('fill', UP); } else { tvVal.textContent = '개장 직후'; tvVal.setAttribute('fill', '#a7a2b6'); }
    let d = '';
    for (let i = 0; i <= 30; i++) {
      const x = 972 + i * 8;
      const trend = !live ? i * 1.1 : (up ? -i * .9 : 0);
      const y = 162 + trend + Math.sin(i * .9 + t * 2.2) * 5 + Math.sin(i * 2.3 + t * 1.3) * 3 - (live ? 0 : 14);
      d += (i ? ' L' : 'M') + x + ',' + f1(y);
    }
    $('#tvLine').setAttribute('d', d); $('#tvLine').setAttribute('stroke', up ? UP : DOWN);

    renderAnt('a', t, k); renderAnt('b', t, k);
    renderMug('a', t); renderMug('b', t);

    const red = t >= 49.6;
    ['A', 'B'].forEach((P, i) => {
      const lit = (t >= 8 && t < 20.5) || (t >= 44.6 && t < 53.2);
      const buzz = t >= 44.6 && t < 45.8 ? Math.sin(t * 95 + i) * 3 : 0;
      $('#phone' + P).setAttribute('transform', `translate(${f1(buzz)},0)`);
      $('#glow' + P).setAttribute('opacity', lit ? (.55 + Math.sin(t * 3 + i) * .08).toFixed(2) : 0);

      $('#scr' + P).setAttribute('fill', red ? UP : DOWN);
    });

    FLOATS.forEach(f => { const p = seg(t, f.a, f.b); f.e.setAttribute('x', f.x); f.e.setAttribute('y', f1(f.y - p * 40)); f.e.setAttribute('opacity', win(t, f.a, f.b, .3).toFixed(2)); });

    ['a', 'b'].forEach(p => {
      const b = BUB[p], l = LINES.find(L => L.who === p && t >= L.a && t < L.b);
      if (!l) { b.g.setAttribute('opacity', 0); return; }
      if (b.cur !== l.text) setBubble(b, l.text);
      const s = lerp(.2, 1, eBack(seg(t, l.a, l.a + .3))) * (1 - .15 * seg(t, l.b - .2, l.b));
      const o = 1 - seg(t, l.b - .2, l.b);
      b.g.setAttribute('opacity', o.toFixed(2));
      b.g.setAttribute('transform', `translate(${b.tip[0]},${b.tip[1]}) scale(${s.toFixed(3)}) translate(${-b.tip[0]},${-b.tip[1]})`);
    });

    const dim = Math.max(win(t, 15.5, 20.7, .5) * .62, win(t, 48.5, 53.2, .5) * .62, win(t, 42.6, 44.5, .5) * .35);
    $('#dim').setAttribute('opacity', dim.toFixed(2));
    const shake = t >= 26.3 && t < 26.6 ? (1 - seg(t, 26.3, 26.6)) : 0;
    pubInner.setAttribute('transform', `translate(${f1(Math.sin(t * 140) * 7 * shake)},${f1(Math.cos(t * 120) * 5 * shake)})`);
  }

  /* phone card */
  const card2 = t >= 40, ca = card2 ? 48.5 : 15.5, cb = card2 ? 53.1 : 20.7;
  const cin = eOut(seg(t, ca, ca + .6)), cout = eIO(seg(t, cb - .5, cb));
  const cy = (1 - cin) * 760 + cout * 760;
  $('#phoneCard').setAttribute('transform', `translate(0,${f1(cy)})`);
  show($('#card1'), !card2); show($('#card2'), card2);
  if (!card2) {
    const lp = eIO(seg(t, 15.9, 17.4));
    $('#c1line').setAttribute('stroke-dashoffset', f1(c1len * (1 - lp)));
    $('#c1area').setAttribute('opacity', seg(t, 16.8, 17.6).toFixed(2));
    const cp = eOut(seg(t, 15.9, 17.2));
    $('#c1pct').textContent = (cp === 0 ? '0.0' : '-' + (38.2 * cp).toFixed(1)) + '%';
    $('#c1krw').textContent = '-₩' + Math.round(12480000 * cp).toLocaleString('ko-KR');
    [...$('#c1rows').children].forEach((g, i) => g.setAttribute('opacity', seg(t, 17.2 + i * .35, 17.6 + i * .35).toFixed(2)));
  } else {
    const gp = eOut(seg(t, 49.3, 50.3));
    const v = lerp(-.12, .42, gp);
    $('#c2pct').textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    $('#c2pct').setAttribute('fill', v > 0 ? UP : DOWN);
    $('#c2sub').setAttribute('opacity', seg(t, 50.2, 50.7).toFixed(2));
    const h = 34 * gp;
    $('#redBody').setAttribute('y', f1(452 - h)); $('#redBody').setAttribute('height', f1(h));
    $('#redWick').setAttribute('y1', f1(452 - h - 8 * gp)); $('#redWick').setAttribute('y2', f1(452 + 6 * gp));
  }

  /* burst */
  const bt = t - 26.3;
  show($('#burst'), bt >= 0 && bt < 1.4);
  if (bt >= 0 && bt < 1.4) {
    const zz = $('#zzan'), s = lerp(.3, 1, eBack(seg(bt, 0, .3)));
    zz.setAttribute('transform', `translate(640,200) scale(${s.toFixed(3)}) translate(-640,-200)`);
    zz.setAttribute('opacity', (1 - seg(bt, 1.0, 1.4)).toFixed(2));
    drops.forEach(d => { const tau = Math.min(bt, .95); d.e.setAttribute('cx', f1(640 + d.vx * tau)); d.e.setAttribute('cy', f1(318 + d.vy * tau + 520 * tau * tau)); d.e.setAttribute('opacity', (1 - seg(bt, .3, .95)).toFixed(2)); });
    const lp = eOut(seg(bt, 0, .35));
    lines.forEach(L => { const r0 = 70 + lp * 40, r1 = r0 + 34 * (1 - seg(bt, .2, .5)); L.e.setAttribute('x1', f1(640 + Math.cos(L.a) * r0)); L.e.setAttribute('y1', f1(318 + Math.sin(L.a) * r0)); L.e.setAttribute('x2', f1(640 + Math.cos(L.a) * r1)); L.e.setAttribute('y2', f1(318 + Math.sin(L.a) * r1)); });
    $('#speedLines').setAttribute('opacity', (1 - seg(bt, .3, .55)).toFixed(2));
  }

  /* notification */
  const ny = lerp(-140, 30, eBack(seg(t, 44.6, 45.05))) - 180 * eIO(seg(t, 47.6, 48.1));
  $('#notif').setAttribute('transform', `translate(640,${f1(ny)})`);

  /* caption */
  const c = CAPS.find(C => t >= C.a && t < C.b);
  if (c) { if (cap.cur !== c.text) setCaption(c.text); cap.g.setAttribute('opacity', win(t, c.a, c.b, .3).toFixed(2)); }
  else cap.g.setAttribute('opacity', 0);

  /* endcard */
  const onEnd = t >= 53.2;
  show($('#endcard'), onEnd);
  if (onEnd) {
    $('#endcard').setAttribute('opacity', seg(t, 53.2, 53.8).toFixed(2));
    const mp = eBack(seg(t, 53.8, 54.3));
    const ang = lerp(-26, 9, mp);
    $('#em1').setAttribute('transform', `translate(${f1(lerp(-70, -34, mp))},0) rotate(${f1(ang)})`);
    $('#em2').setAttribute('transform', `translate(${f1(lerp(70, 34, mp))},0) rotate(${f1(-ang)})`);
    $('#emSpark').setAttribute('opacity', win(t, 54.2, 55.2, .2).toFixed(2));
    ['end1', 'end2', 'end3', 'end4'].forEach((id, i) => { const e = $('#' + id), q = eOut(seg(t, 53.6 + i * .45, 54.2 + i * .45)); e.setAttribute('opacity', q.toFixed(2)); e.setAttribute('transform', `translate(0,${f1((1 - q) * 14)})`); });
  }

  /* fades */
  let fade = 0;
  if (t >= 7.3 && t < 8.2) fade = seg(t, 7.3, 8.2);
  else if (t >= 8.2 && t < 9) fade = 1 - seg(t, 8.2, 9);
  fade = Math.max(fade, seg(t, 59.3, 60));
  $('#fade').setAttribute('opacity', fade.toFixed(2));
}

/* ---------------- SOUND (optional, synthesized) ---------------- */
let actx = null, soundOn = false;
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try { actx = new AC(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, start, dur, type, gain) {
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), now = c.currentTime + start;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(gain, now + .008); g.gain.exponentialRampToValueAtTime(.0001, now + dur);
  o.connect(g).connect(c.destination); o.start(now); o.stop(now + dur + .05);
}
const SFX = [
  { t: 22.5, f: () => { tone(180, 0, .18, 'triangle', .12); tone(230, .25, .16, 'triangle', .1); } },
  { t: 26.3, f: () => { [[2093, 0], [3136, 0], [2637, .05], [3951, .05]].forEach(([f, d]) => tone(f, d, 1.1, 'sine', .12)); } },
  { t: 44.6, f: () => { [0, .3, .6].forEach(d => tone(150, d, .2, 'square', .035)); tone(1318, .05, .5, 'sine', .08); } },
  { t: 49.8, f: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .5, 'triangle', .08)); } },
  { t: 54.2, f: () => { tone(2637, 0, .8, 'sine', .08); tone(3520, .02, .7, 'sine', .06); } },
];

/* ---------------- PLAYER ---------------- */
let t = 0, playing = false, last = null;
const playBtn = $('#play'), scrub = $('#scrub'), timeEl = $('#time'), big = $('#bigplay');
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>';
const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const CH = [[0, '퇴근길'], [9, '계좌 확인'], [21.6, '짠'], [29.4, '위로'], [42.6, '미국장 개장'], [53.2, '엔딩']];
const chipEls = CH.map(([ct, name]) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.innerHTML = `<span class="t">${fmt(ct)}</span>${name}`;
  b.addEventListener('click', () => { seek(ct + .01); });
  li.appendChild(b); $('#chapters').appendChild(li); return b;
});
function setPlaying(v) {
  playing = v; last = null;
  playBtn.innerHTML = (v ? ICON_PAUSE : ICON_PLAY) + `<span class="lbl">${v ? '일시정지' : '재생'}</span>`;
  playBtn.setAttribute('aria-label', v ? '일시정지' : '재생');
  big.hidden = v;
}
function ui() {
  scrub.value = t.toFixed(2);
  timeEl.textContent = fmt(t) + ' / ' + fmt(DUR);
  let ci = 0; CH.forEach((c, i) => { if (t >= c[0]) ci = i; });
  chipEls.forEach((b, i) => b.setAttribute('aria-current', i === ci ? 'true' : 'false'));
}
function seek(v) { t = clamp(v, 0, DUR - .001); render(t, 1); ui(); }
function frame(now) {
  if (playing) {
    if (last == null) last = now;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    const prev = t; t += dt;
    if (t >= DUR) t = 0;
    if (soundOn && t > prev) SFX.forEach(s => { if (prev < s.t && t >= s.t) s.f(); });
    render(t, dt); ui();
  }
  requestAnimationFrame(frame);
}
playBtn.addEventListener('click', () => setPlaying(!playing));
big.addEventListener('click', e => { e.stopPropagation(); setPlaying(true); });
$('#stageWrap').addEventListener('click', () => setPlaying(!playing));
$('#restart').addEventListener('click', () => { seek(0); setPlaying(true); });
scrub.addEventListener('input', () => seek(+scrub.value));
$('#sound').addEventListener('click', e => {
  soundOn = !soundOn; if (soundOn) audio();
  e.currentTarget.setAttribute('aria-pressed', soundOn);
  $('#soundLbl').textContent = soundOn ? '소리 끄기' : '소리 켜기';
  $('#soundWave').setAttribute('opacity', soundOn ? 1 : .35);
});
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  e.preventDefault(); setPlaying(!playing);
});
function remeasure() { tickW = ticker.getComputedTextLength() || tickW; BUB.a.cur = BUB.b.cur = cap.cur = null; render(t, 1); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);
remeasure();

const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { seek(26.45); setPlaying(false); } else { seek(0); setPlaying(true); }
requestAnimationFrame(frame);
})();
</script>
